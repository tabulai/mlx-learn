name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONWARNINGS: default
  # Correctness only on shared runners. Absolute performance is measured by the
  # nightly job on fixed self-hosted Apple hardware; shared runners are too noisy
  # for a timing gate.
  MLXLEARN_CI: "1"

jobs:
  compliance:
    name: compliance gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "."
      - name: Branding, private imports, headers, licenses, layout
        run: python tools/compliance.py

  lint:
    name: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check src tests tools benchmarks
      # No `ruff format --check`. The project has not adopted an autoformatter,
      # and turning one on now would rewrite every file in a single commit that
      # buries the real history. Adopting one is a maintainer decision, not
      # something a CI job should force.

  test:
    name: py${{ matrix.python }} / sklearn ${{ matrix.sklearn }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      # Paired matrix, not a cross product: scikit-learn 1.8+ requires Python >= 3.11,
      # so a naive cross product would schedule jobs that cannot resolve.
      matrix:
        include:
          - python: "3.10"
            sklearn: "1.7.2"
          - python: "3.11"
            sklearn: "1.8.0"
          - python: "3.12"
            sklearn: "1.9.0"
          - python: "3.13"
            sklearn: "1.8.0"
          - python: "3.13"
            sklearn: "1.9.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scikit-learn==${{ matrix.sklearn }}"
          python -m pip install -e ".[test]"
          python -c "from mlxlearn._solvers import _metal_loop; print(_metal_loop.__file__)"
          python -c "from mlxlearn._kernels import _neighbors_cpu_native; print(_neighbors_cpu_native.__file__)"
          python -c "from mlxlearn._solvers import _smo_native, _smo_block_native; from mlxlearn._kernels import _svc_cpu_native; print(_smo_native.__file__, _smo_block_native.__file__, _svc_cpu_native.__file__)"
      - name: Assert the pinned floor is what we think it is
        run: |
          python - <<'PY'
          import sklearn, numpy, mlx.core as mx
          from packaging.version import Version
          assert Version(sklearn.__version__) >= Version("1.7"), sklearn.__version__
          # MLX floor is asserted here rather than only in metadata so a resolver
          # that quietly picks an older wheel fails loudly.
          assert Version(mx.__version__) >= Version("0.29"), mx.__version__
          print("sklearn", sklearn.__version__, "numpy", numpy.__version__, "mlx", mx.__version__)
          PY
      - name: GPU numerical and subinterpreter regressions
        run: >-
          python -m pytest -q
          tests/unit/test_native_log1p.py
          tests/unit/test_device_seeded_tolerance.py
          tests/unit/test_hessian_sketch.py
          tests/unit/test_native_command.py
          tests/unit/test_native_logistic.py
          tests/unit/test_native_logistic_wide.py
          tests/unit/test_shifted_convergence.py
          tests/unit/test_shifted_bias_precision.py
          tests/unit/test_multinomial_bias_precision.py
          tests/unit/test_shifted_gpu_accuracy.py
          tests/unit/test_weighted_objective_progress.py
          tests/unit/test_weighted_native_tolerance.py
          tests/unit/test_curvature_floor.py
          tests/unit/test_newton_routing.py
          tests/unit/test_native_cg.py
          tests/unit/test_device_newton.py
          tests/unit/test_native_resume.py
          tests/unit/test_sketch_capability.py
          tests/unit/test_fused_lbfgs.py
      - name: Test
        run: python -m pytest -q --durations=25
      - name: Benchmark harness regressions
        run: python -m pytest -q benchmarks/test_knn_*.py
      - name: Locked two-liner runs verbatim
        run: |
          python - <<'PY'
          from mlxlearn import patch_sklearn
          patch_sklearn()
          PY

  build:
    name: sdist and wheel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine wheel "setuptools>=77"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel has the CPython tag and all native extensions
        run: |
          python - <<'PY'
          import pathlib, sys, sysconfig, zipfile
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          name = wheels[0].name
          tag = f"cp{sys.version_info.major}{sys.version_info.minor}"
          assert f"-{tag}-{tag}-macosx" in name, f"expected a {tag} Apple wheel, got {name}"
          assert name.endswith("_arm64.whl"), f"expected an Apple silicon wheel, got {name}"
          with zipfile.ZipFile(wheels[0]) as wheel:
              assert any(n.endswith("/_metal_loop.abi3.so") for n in wheel.namelist())
              cpu = "mlxlearn/_kernels/_neighbors_cpu_native" + sysconfig.get_config_var("EXT_SUFFIX")
              assert cpu in wheel.namelist(), cpu
              for module in ("_solvers/_smo_native", "_solvers/_smo_block_native", "_kernels/_svc_cpu_native"):
                  native = "mlxlearn/" + module + sysconfig.get_config_var("EXT_SUFFIX")
                  assert native in wheel.namelist(), native
          print(name)
          PY
      - name: Installs clean from the wheel
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --upgrade pip
          /tmp/wheeltest/bin/pip install dist/*.whl
          /tmp/wheeltest/bin/python -c "import mlxlearn; print(mlxlearn.__version__); mlxlearn.patch_sklearn(); mlxlearn.unpatch_sklearn()"
          /tmp/wheeltest/bin/python -c "from mlxlearn._solvers import _metal_loop; print(_metal_loop.__file__)"
          /tmp/wheeltest/bin/python -c "from mlxlearn._kernels import _neighbors_cpu_native; print(_neighbors_cpu_native.__file__)"
          /tmp/wheeltest/bin/python -c "from mlxlearn._solvers import _smo_native, _smo_block_native; from mlxlearn._kernels import _svc_cpu_native; print(_smo_native.__file__, _smo_block_native.__file__, _svc_cpu_native.__file__)"
      - name: Rebuild the wheel from the source distribution
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/sdist-wheel dist/*.tar.gz
          python - <<'PY'
          import pathlib, sys, sysconfig, tarfile, zipfile
          archives = list(pathlib.Path("dist").glob("*.tar.gz"))
          assert len(archives) == 1, archives
          with tarfile.open(archives[0]) as archive:
              assert any(n.endswith("/src/mlxlearn/_solvers/_metal_loop.mm") for n in archive.getnames())
              assert any(n.endswith("/src/mlxlearn/_kernels/_neighbors_cpu_native.cpp") for n in archive.getnames())
              for module in ("_solvers/_smo_native", "_solvers/_smo_block_native", "_kernels/_svc_cpu_native"):
                  source = "/src/mlxlearn/" + module + ".cpp"
                  assert any(n.endswith(source) for n in archive.getnames()), source
          wheels = list(pathlib.Path("/tmp/sdist-wheel").glob("*.whl"))
          assert len(wheels) == 1 and wheels[0].name.endswith("_arm64.whl"), wheels
          tag = f"cp{sys.version_info.major}{sys.version_info.minor}"
          assert f"-{tag}-{tag}-macosx" in wheels[0].name, wheels[0].name
          with zipfile.ZipFile(wheels[0]) as wheel:
              assert any(n.endswith("/_metal_loop.abi3.so") for n in wheel.namelist())
              cpu = "mlxlearn/_kernels/_neighbors_cpu_native" + sysconfig.get_config_var("EXT_SUFFIX")
              assert cpu in wheel.namelist(), cpu
              for module in ("_solvers/_smo_native", "_solvers/_smo_block_native", "_kernels/_svc_cpu_native"):
                  native = "mlxlearn/" + module + sysconfig.get_config_var("EXT_SUFFIX")
                  assert native in wheel.namelist(), native
          PY
      - name: Select Python 3.10 for stable ABI check
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Import the 3.13-built Metal abi3 extension on Python 3.10
        run: |
          python -m venv /tmp/wheeltest310
          /tmp/wheeltest310/bin/python - <<'PY'
          import importlib.util, pathlib, tempfile, zipfile
          # Only Metal has a stable ABI. The wheel also contains a CPython-minor
          # CPU extension, so installing the complete 3.13 wheel here is invalid.
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with tempfile.TemporaryDirectory() as temporary:
              with zipfile.ZipFile(wheels[0]) as wheel:
                  members = [n for n in wheel.namelist() if n.endswith("/_metal_loop.abi3.so")]
                  assert len(members) == 1, members
                  extension = pathlib.Path(wheel.extract(members[0], temporary))
              spec = importlib.util.spec_from_file_location("_metal_loop", extension)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              print(module.__file__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
