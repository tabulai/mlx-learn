name: Release

# Publishing uses PyPI Trusted Publishing (OIDC). No API token is stored in this
# repository. Configure the publisher on PyPI for:
#   owner: tabulai   repository: mlx-learn   workflow: release.yml   environment: pypi
#
# The `pypi` environment should require a manual approval, so that a tag push alone
# cannot publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions (Python ${{ matrix.python }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build --wheel
      - name: Build one source distribution
        if: matrix.python == '3.13'
        run: python -m build --sdist
      - run: python -m twine check --strict dist/*
      - name: Verify native wheel is present
        run: |
          python - <<'PY'
          import pathlib, sys, sysconfig, zipfile
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          tag = f"cp{sys.version_info.major}{sys.version_info.minor}"
          assert f"-{tag}-{tag}-macosx" in wheels[0].name, wheels[0].name
          assert wheels[0].name.endswith("_arm64.whl"), wheels[0].name
          with zipfile.ZipFile(wheels[0]) as wheel:
              assert any(n.endswith("/_metal_loop.abi3.so") for n in wheel.namelist())
              cpu = "mlxlearn/_kernels/_neighbors_cpu_native" + sysconfig.get_config_var("EXT_SUFFIX")
              assert cpu in wheel.namelist(), cpu
          PY
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = pathlib.Path("pyproject.toml").read_text()
          version = re.search(r'^version = "([^"]+)"', text, re.M).group(1)
          if tag != version:
              sys.exit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(version)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python }}
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mlx-learn
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
