[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-learn"
# The version lives in exactly one place, src/mlxlearn/__init__.py. setuptools reads
# the literal statically, so building the metadata never imports mlx.
dynamic = ["version"]
description = "MLX-accelerated classical machine learning with a scikit-learn compatible API for Apple silicon"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Bojan Tunguz" }]
keywords = ["machine-learning", "mlx", "apple-silicon", "scikit-learn", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23.5",
    "scikit-learn>=1.7,<1.10",
    # 0.31.2 is the first MLX release on which concurrent fits from several
    # threads do not abort the process (tests/unit/test_invariants.py).
    "mlx>=0.31.2,<1.0",
]

[project.optional-dependencies]
# pandas because DataFrames are the most common input scikit-learn users pass, and
# the tests of how mlxlearn reads them (sparse frames, per-column range checks) skip
# without it.
test = ["pytest>=8.0", "scipy>=1.10", "packaging>=23.0", "pandas>=2.2.3"]
bench = ["pytest>=8.0", "scipy>=1.10"]
# ruff is pinned exactly, and to the same version CI lints with, so a new ruff release
# cannot turn main red on its own. Dependabot proposes the bumps.
dev = [
    "pytest>=8.0",
    "scipy>=1.10",
    "packaging>=23.0",
    "pandas>=2.2.3",
    "ruff==0.15.8",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/tabulai/mlx-learn"
Repository = "https://github.com/tabulai/mlx-learn"
Documentation = "https://github.com/tabulai/mlx-learn/tree/main/docs"
Changelog = "https://github.com/tabulai/mlx-learn/blob/main/CHANGELOG.md"
Issues = "https://github.com/tabulai/mlx-learn/issues"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlxlearn*"]

[tool.setuptools.package-data]
mlxlearn = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "mlxlearn.__version__" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `slow` tests are deselected by default so the everyday run stays fast. CI runs them in
# a job of their own (`pytest -m slow`), and `pytest -m ""` runs everything.
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: long-running tests; deselected by default, run with `pytest -m slow`",
    "benchmark: performance measurement, not a correctness gate",
    "gpu: requires a working MLX GPU device; skipped without one unless MLXLEARN_REQUIRE_GPU=1",
]
# Deliberately no global error-on-MLXLearnFallbackWarning: the Layer 2 suite
# exercises fallbacks on purpose, and the warning is deduplicated per
# (estimator, reason), so promoting it to an error would make results depend on
# test order. Tests that must run on MLX assert `execution_backend_` instead,
# which is the direct claim rather than a proxy for it.

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools", "benchmarks"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
